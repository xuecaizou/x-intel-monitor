name: CI (offline)

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-tests:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: Verify no secrets in repo
        run: |
          python scripts/check_no_secrets.py || { echo "SECRET CHECK FAILED"; python -c "import subprocess;print(subprocess.run(['git','ls-files'],capture_output=True,text=True).stdout[:2000])"; exit 1; }
      - name: Run offline test suite
        run: python offline_test.py
      - name: Compile check
        run: python -m compileall -q app api tests *.py
